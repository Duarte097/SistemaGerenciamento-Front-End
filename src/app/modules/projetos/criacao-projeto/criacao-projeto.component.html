<div class="modal-backdrop"></div>
<div class="modal-content">
  <form [formGroup]="createProjetoForm" (ngSubmit)="onSubmit()">
    <div class="button-fechar-container">
      <button icon="pi pi-times" class="button-fechar" (click)="close()">
        <span class="p-button-icon pi pi-times"></span>
      </button>
    </div>
    <div class="input-content">
      <input type="text" formControlName="nome" placeholder="Digite o nome do projeto">
      <div class="card flex justify-content-center">
        <textarea class="textarea-content"
          formControlName="descricao"
          rows="5"
          cols="30"
          pInputTextarea
          [autoResize]="true">
        </textarea>
      </div>
      <div class="calendar-container">
        <p-calendar formControlName="dataInicio" [(ngModel)]="date2" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" class="calendar"/>
        <p-calendar formControlName="dataFim" [(ngModel)]="date3" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" class="calendar"/>
      </div>
      <p-dropdown
        formControlName="status"
        [(ngModel)]="selectedProjetos"
        [options]="status"
        optionLabel="name"
        optionValue="code"
        placeholder="Selecione o status"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <p-dropdown
        formControlName="idUsuario"
        [(ngModel)]="selectedUsuarios"
        [options]="usuarios"
        optionLabel="nome"
        optionValue="code"
        placeholder="Selecione o Usuario responsavel"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <div class="button-salvar-container">
        <button class="button-salvar" [disabled]="createProjetoForm.invalid">Salvar</button>
      </div>
    </div>
  </form>
</div>
