<div class="modal-backdrop"></div>
<div class="modal-content">
  <form [formGroup]="editActivityForm" (ngSubmit)="onSubmit()">
    <div class="button-fechar-container">
      <button icon="pi pi-times" class="button-fechar" (click)="close()">
        <span class="p-button-icon pi pi-times"></span>
      </button>
    </div>
    <div class="input-content">
      <input type="text" formControlName="nomeAtividade" [(ngModel)]="activityData.nomeAtividade">
      <div class="card flex justify-content-center">
        <textarea class="textarea-content"
          [(ngModel)]="activityData.descricao_atividade"
          formControlName="descricao"
          rows="3"
          cols="30"
          pInputTextarea
          [autoResize]="true">
        </textarea>
      </div>
      <div class="calendar-container">
        <p-calendar
          placeholder="Data de Inicio"
          formControlName="dataInicio"
          [(ngModel)]="activityData.dataInicio"
          inputId="icondisplay"
          [showIcon]="true"
          inputId="icondisplay"
          class="calendar"
          dateFormat="dd/mm/yy"
        />
        <p-calendar
          placeholder="Data de Fim"
          formControlName="dataFim"
          [(ngModel)]="activityData.dataFim"
          inputId="icondisplay"
          [showIcon]="true"
          inputId="icondisplay"
          class="calendar"
          dateFormat="dd/mm/yy"
          [minDate]="editActivityForm.get('dataInicio')?.value"
        />
      </div>
      <p-dropdown
        formControlName="status"
        [(ngModel)]="activityData.status"
        [options]="status"
        optionLabel="name"
        optionValue="code"
        placeholder="Selecione o status"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <p-dropdown
        formControlName="idUsuario"
        [(ngModel)]="userData.nome"
        [options]="usuarios"
        optionLabel="nome"
        optionValue="id_usuarios"
        placeholder="Selecione o Usuario responsavel"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <p-dropdown
        formControlName="idProjeto"
        [(ngModel)]="projectData.nomeProjeto"
        [options]="projeto"
        optionLabel="nomeProjeto"
        optionValue="id_projeto"
        placeholder="Selecione o projeto"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <div class="button-salvar-container">
        <button class="button-salvar" type="button" (click)="onSubmit()" [disabled]="editActivityForm.invalid">Salvar</button>
      </div>
    </div>
  </form>
</div>
