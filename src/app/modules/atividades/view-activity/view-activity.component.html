<div class="modal-backdrop"></div>
<div class="modal-content">
  <div class="button-fechar-container">
    <button icon="pi pi-times" class="button-fechar" (click)="close()">
      <span class="p-button-icon pi pi-times"></span>
    </button>
  </div>
  <div class="input-content" >
    <input  pTextarea [disabled]="true" [(ngModel)]="activityData.nomeAtividade" />
    <div class="card flex justify-content-center">
      <textarea class="textarea-content"
        [(ngModel)]="activityData.descricao_atividade"
        pTextarea [disabled]="true"
        rows="3"
        cols="30"
        pInputTextarea
        [autoResize]="true">
      </textarea>
    </div>
    <div class="calendar-container">
      <p-calendar
        [disabled]="true"
        [(ngModel)]="activityData.dataInicio"
        [showIcon]="true"
        inputId="startDate"
        class="calendar"
        dateFormat="dd/mm/yy"
      />
      <p-calendar
        [disabled]="true"
        [(ngModel)]="activityData.dataFim"
        [showIcon]="true"
        inputId="endDate"
        class="calendar"
        dateFormat="dd/mm/yy"
      />
    </div>
    <input pInputText [disabled]="true" [(ngModel)]="activityData.user.nome" />
    <input pInputText [disabled]="true" [(ngModel)]="activityData.status" />
    <input  pInputText [disabled]="true" [(ngModel)]="activityData.projeto.nomeProjeto" />
  </div>
</div>
