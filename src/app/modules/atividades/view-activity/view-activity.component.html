<div class="modal-backdrop"></div>
<div class="modal-content">
  <div class="button-fechar-container">
    <button icon="pi pi-times" class="button-fechar" (click)="close()">
      <span class="p-button-icon pi pi-times"></span>
    </button>
  </div>
  <div class="input-content" >
    <div class="float-container">
      <input type="text" id="atividade" [disabled]="true" [(ngModel)]="activityData.nomeAtividade" class="float-input" />
      <label for="atividade" class="float-label">Atividade</label>
    </div>
    <div class="card flex justify-content-center float-container">
      <textarea class="textarea-content"
        [(ngModel)]="activityData.descricao_atividade"
        id="descricao"
        type="text"
        class="float-input"
        pTextarea [disabled]="true"
        rows="3"
        cols="30"
        pInputTextarea
        [autoResize]="true">
      </textarea>
      <label for="descricao" class="float-label">Descrição</label>
    </div>
    <div class="calendar-container">
      <p-calendar
        [disabled]="true"
        [(ngModel)]="activityData.dataInicio"
        [showIcon]="true"
        inputId="startDate"
        class="calendar"
        dateFormat="dd/mm/yy"
      />
      <p-calendar
        [disabled]="true"
        [(ngModel)]="activityData.dataFim"
        [showIcon]="true"
        inputId="endDate"
        class="calendar"
        dateFormat="dd/mm/yy"
      />
    </div>
    <div class="float-container">
      <input type="text" id="usuario" [disabled]="true" [(ngModel)]="activityData.user.nome" class="float-input"/>
      <label for="usuario" class="float-label">Usuario</label>
    </div>
    <div class="float-container">
      <input type="text" id="status" [disabled]="true" [(ngModel)]="activityData.status" class="float-input"/>
      <label for="status" class="float-label">Status</label>
    </div>
    <div class="float-container">
      <input  type="text" id="projeto" [disabled]="true" [(ngModel)]="activityData.projeto.nomeProjeto" class="float-input" />
      <label for="projeto" class="float-label">Projeto</label>
    </div>
  </div>
</div>
