<div class="modal-backdrop"></div>
<div class="modal-content">
  <div class="button-fechar-container">
    <button icon="pi pi-times" class="button-fechar" (click)="close()">
      <span class="p-button-icon pi pi-times"></span>
    </button>
  </div>
  <div class="input-content" >
    <input  pTextarea [disabled]="true" [(ngModel)]="projectData.nomeProjeto" />
    <div class="card flex justify-content-center">
      <textarea class="textarea-content"
        [(ngModel)]="projectData.descricao"
        pTextarea [disabled]="true"
        rows="3"
        cols="30"
        pInputTextarea
        [autoResize]="true">
      </textarea>
    </div>
    <div class="calendar-container">
      <p-calendar  [disabled]="true" [(ngModel)]="projectData.dataInicio"  [showIcon]="true" inputId="startDate" class="calendar"/>
      <p-calendar  [disabled]="true" [(ngModel)]="projectData.dataFim" [showIcon]="true" inputId="endDate" class="calendar"/>
    </div>
    <input pInputText [disabled]="true" [(ngModel)]="projectData.usuarioResponsavel.nome" />
    <input pInputText [disabled]="true" [(ngModel)]="projectData.status" />
    <input  pInputText [disabled]="true" [(ngModel)]="projectData.prioridade" />
  </div>
</div>
