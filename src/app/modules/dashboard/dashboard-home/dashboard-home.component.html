<div class="surface-card shadow-2 border-round p-4">
  <div class="flex justify-content-end align-items-center mb-5 card-tarefas">
    <span class="text-xl text-900 font-medium">Dashboard</span>
  </div>
  <div class="dashboard-container">
    <div class="card-container">
        <div class="card card-products">
            <div class="card-title">Projetos</div>
            <div class="card-value">{{ totalProjetosConcluidos }}</div>
        </div>
        <div class="card card-categories">
            <div class="card-title">Atividades</div>
            <div class="card-value">{{ totalAtividadesEmAndamento }}</div>
        </div>
        <div class="card card-customers">
            <div class="card-title">Horas Lançadas</div>
            <div class="card-value">{{ totalHorasLancadas }}</div>
        </div>
        <!--div class="card card-alerts">
            <div class="card-title">ALERTS</div>
            <div class="card-value">56</div>
        </-div-->
    </div>
    <div class="charts-container">
        <div class="chart-card">
            <div class="chart-title">Projetos</div>
            <canvas #projetoChart></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Atividades</div>
            <canvas #atividadeChart></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">Horas Lançadas</div>
          <canvas #horasChart></canvas>
        </div>
    </div>
  </div>
</div>
