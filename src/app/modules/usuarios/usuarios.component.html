<div class="surface-card shadow-2 border-round p-4">
  <div class="flex justify-content-between align-items-center mb-5 card-tarefas">
    <span class="text-xl text-900 font-medium">Usuários</span>
    <button class="button-create-icon" (click)="openModalCreate()">
      <span class="p-button-icon pi pi-plus"></span>
    </button>
  </div>
  <form [formGroup]="editUserForm" (ngSubmit)="onSubmit()">
    <div class="input-container">
      <div class="input-group">
        <i class="pi pi-user"></i>
        <input pInputText formControlName="nome" [(ngModel)]="userData.nome" placeholder="Nome" />
      </div>
      <div class="input-group">
        <i class="pi pi-envelope"></i>
        <input pInputText formControlName="email" [(ngModel)]="userData.email" placeholder="E-mail" />
      </div>
      <div class="input-group">
        <i class="pi pi-lock"></i>
        <input pInputText formControlName="senha" [(ngModel)]="userData.senha" placeholder="Senha" type="password"/>
      </div>
      <div class="input-group">
        <i class="pi pi-user-edit"></i>
        <input pInputText formControlName="perfil" [(ngModel)]="userData.perfil" placeholder="Perfil" />
      </div>
    </div>
    <div class="button-salvar-container">
      <button class="button-salvar" type="button" (click)="onSubmit()" [disabled]="editUserForm.invalid">Salvar</button>
    </div>
  </form>
</div>
