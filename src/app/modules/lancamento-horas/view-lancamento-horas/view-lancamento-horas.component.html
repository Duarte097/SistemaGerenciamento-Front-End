<div class="modal-backdrop"></div>
<div class="modal-content">
  <div class="button-fechar-container">
    <button icon="pi pi-times" class="button-fechar" (click)="close()">
      <span class="p-button-icon pi pi-times"></span>
    </button>
  </div>
  <div class="input-content" >
    <div class="float-container">
      <input type="text" id="usuario" [disabled]="true" [(ngModel)]="releaseHoursData.user.nome" class="float-input" />
      <label for="usuario" class="float-label">Usuário</label>
    </div>
    <div class="float-container">
      <input type="text" id="atividade" [disabled]="true" [(ngModel)]="releaseHoursData.atividade.nomeAtividade" class="float-input" />
      <label for="atividade" class="float-label">Atividade</label>
    </div>
    <div class="card flex justify-content-center float-container">
      <textarea class="textarea-content"
        [(ngModel)]="releaseHoursData.descricao"
        id="descricao"
        type="text"
        class="float-input"
        pTextarea [disabled]="true"
        rows="3"
        cols="30"
        pInputTextarea
        [autoResize]="true">
      </textarea>
      <label for="descricao" class="float-label">Descrição</label>
    </div>
    <div class="calendar-container">
      <p-calendar
        [disabled]="true"
        [(ngModel)]="releaseHoursData.dataInicio"
        [timeOnly]="true"
        [showIcon]="true"
        inputId="startDate"
        class="calendar"
        hourFormat="24"
        icon="pi pi-clock"
      />
      <p-calendar
        [disabled]="true"
        [(ngModel)]="releaseHoursData.dataFim"
        [timeOnly]="true"
        [showIcon]="true"
        inputId="endDate"
        class="calendar"
        hourFormat="24"
        icon="pi pi-clock"
      />
    </div>
  </div>
</div>
