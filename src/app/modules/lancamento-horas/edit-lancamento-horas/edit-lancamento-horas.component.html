<div class="modal-backdrop"></div>
<div class="modal-content">
  <form [formGroup]="editReleaseHoursForm" (ngSubmit)="onSubmit()">
    <div class="button-fechar-container">
      <button icon="pi pi-times" class="button-fechar" (click)="close()">
        <span class="p-button-icon pi pi-times"></span>
      </button>
    </div>
    <div class="input-content">
      <div class="card flex justify-content-center">
        <textarea class="textarea-content"
          [(ngModel)]="releaseHoursData.descricao"
          formControlName="descricao"
          rows="3"
          cols="30"
          pInputTextarea
          [autoResize]="true">
        </textarea>
      </div>
      <div class="calendar-container">
        <p-calendar
          placeholder="Data de Inicio"
          formControlName="dataInicio"
          [(ngModel)]="releaseHoursData.dataInicio"
          inputId="icondisplay"
          [timeOnly]="true"
          [showIcon]="true"
          inputId="icondisplay"
          class="calendar"
          hourFormat="24"
          icon="pi pi-clock"
        />
        <p-calendar
          placeholder="Data de Fim"
          formControlName="dataFim"
          [(ngModel)]="releaseHoursData.dataFim"
          inputId="icondisplay"
          [timeOnly]="true"
          [showIcon]="true"
          inputId="icondisplay"
          class="calendar"
          hourFormat="24"
          icon="pi pi-clock"
        />
        <p-calendar
          placeholder="Data de Lancamento"
          formControlName="dataLancamento"
          [(ngModel)]="releaseHoursData.dataLancamento"
          inputId="icondisplay"
          [showIcon]="true"
          inputId="icondisplay"
          class="calendar"
          dateFormat="dd/mm/yy"
        />
      </div>
      <p-dropdown
        formControlName="idUsuario"
        [(ngModel)]="userData.nome"
        [options]="usuarios"
        optionLabel="nome"
        optionValue="id_usuarios"
        placeholder="Selecione o Usuario responsavel"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <p-dropdown
        formControlName="idAtividade"
        [(ngModel)]="activityData.nomeAtividade"
        [options]="atividade"
        optionLabel="nomeAtividade"
        optionValue="id_atividade"
        placeholder="Selecione a Atividade"
        [style]="{ minWidth: '14rem' }"
        class="dropdown-content">
      </p-dropdown>
      <div class="button-salvar-container">
        <button class="button-salvar" type="button" (click)="onSubmit()" [disabled]="editReleaseHoursForm.invalid">Salvar</button>
      </div>
    </div>
  </form>
</div>
